<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup Form</title>
<link rel="stylesheet" href="from.css">

</head>

<body>

<div class="card">
    <h2>Create your account</h2>
    <p>Fill in the details below to get started</p>

    <form id="signupForm">

        <div class="input-row">
            <div class="input-group">
                <label>First Name</label>
                <input type="text" id="firstName" placeholder="First Name">
                <div class="error" id="firstNameError"></div>
            </div>
            <br>
            <br>

            <div class="input-group">
                <label>Last Name</label>
                <input type="text" id="lastName" placeholder="Last Name">
                <div class="error" id="lastNameError"></div>
            </div>
        </div>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="sample@gmail.com">
            <div class="error" id="emailError"></div>
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="+923182983798">
            <div class="error" id="phoneError"></div>
        </div>

        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter Username">
            <div class="error" id="usernameError"></div>
        </div>

        <div class="input-group">
            <label>Password</label>
            <div class="password-box">
                <input type="password" id="password" placeholder="Enter Password">
                <span class="toggle" onclick="togglePassword('password')">👁</span>
            </div>
            <div class="error" id="passwordError"></div>
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <div class="password-box">
                <input type="password" id="confirmPassword" placeholder="Again Enter Your Password" >
                <span class="toggle" onclick="togglePassword('confirmPassword')">👁</span>
            </div>
            <div class="error" id="confirmPasswordError"></div>
        </div>

        <button type="submit">Create Account</button>

        <div class="success" id="successMsg"></div>
    </form>
</div>

<script src="form.js">

</script>

</body>
</html>
